name: CI with PNPM and Turborepo

on:
  workflow_call:

jobs:
  pnpm-turborepo-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm install --frozen-lockfile

      - name: Run on affected packages
        run: pnpm build test lint format --filter='...[origin/main]'
