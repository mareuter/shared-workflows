name: CI with PNPM and Turborepo

on:
  workflow_call:
    inputs:
      use-playwright:
        required: false
        type: boolean
        default: false

jobs:
  pnpm-turborepo-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-${{ github.ref_name }}-

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: ${{ inputs.use-playwright }}
        run: pnpm exec playwright install --with-deps

      - name: Run linting and formatting
        run: pnpm lint format --filter=[origin/main]

      - name: Build components and dependencies
        run: pnpm build --filter=[origin/main]

      - name: Run tests
        run: pnpm test --filter=[origin/main]
