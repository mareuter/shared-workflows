name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v8
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run linters
        run: uv run --only-group=tox tox run -e lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v8
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run tests
        run: uv run --only-group=tox tox run -e py,coverage-report
